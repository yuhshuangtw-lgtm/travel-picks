<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Picks</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Travel Picks">
<meta name="theme-color" content="#1f6b55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: one column, sticky filter bar (search + category chips), card grid grouped by category */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#15231e; --muted:#5d6b65; --line:#dbe2dd;
  --jade:#1f6b55; --jade-soft:#e2efe9; --amber:#c9781a; --amber-soft:#fbeedb;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --ink:#e7eee9; --muted:#97a69f; --line:#26342e;
  --jade:#5cc0a0; --jade-soft:#1b3129; --amber:#f0a646; --amber-soft:#3a2a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --ink:#e7eee9; --muted:#97a69f; --line:#26342e;
  --jade:#5cc0a0; --jade-soft:#1b3129; --amber:#f0a646; --amber-soft:#3a2a14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:40px 20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--jade);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;margin:8px 0 12px;text-wrap:balance;letter-spacing:-.02em}
h1 span{color:var(--amber)}
.lede{color:var(--muted);max-width:60ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{padding-block:8px 48px}
section{padding-top:28px}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.blurb{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600;font-size:16px;line-height:1.3;margin:0;display:flex;align-items:center;gap:4px}
.zh{font-family:var(--zh);font-weight:700;font-size:15px;color:var(--jade);margin-top:2px;display:flex;align-items:center;gap:4px}
.cp{display:inline-grid;place-items:center;width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.cp:hover{background:var(--jade-soft);color:var(--jade)}
.cp:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.cp.ok{color:var(--jade)}
.area{flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:2px}
.note{margin:0;font-size:14px;color:var(--ink)}
.tip{font-size:13px;background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:6px 10px}
.tip::before{content:"Tip · ";font-weight:600;color:var(--amber)}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;text-decoration:none;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.btn.map{background:var(--jade-soft);color:var(--jade)}
.btn.map:hover{background:var(--jade);color:var(--bg)}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 1px}
.tag{font:inherit;font-size:12px;font-weight:500;padding:4px 9px;border-radius:6px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tag::before{content:"#";opacity:.6;margin-right:1px}
.tag:hover{color:var(--ink);border-color:var(--muted)}
.tag[aria-pressed="true"]{background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags .tag{font-size:11px;padding:2px 7px}
.status{font-size:13px;color:var(--muted);padding-top:16px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding-block:24px 40px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,color .15s,border-color .15s}}
.cities{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.city{font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.city span{font-family:var(--zh);font-weight:500;opacity:.8}
.city[aria-current="page"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.city:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Filter bar: one compact sticky row on phones, filters in a bottom sheet */
.row{display:flex;gap:8px;align-items:stretch}
.row .search{flex:1;min-width:0}
.fbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:600;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fbtn .n,.done .n{background:var(--amber);color:var(--bg);border-radius:999px;font-size:11px;padding:1px 6px;font-variant-numeric:tabular-nums}
.fbtn:focus-visible,.x:focus-visible,.reset:focus-visible,.done:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.active{display:flex;flex-wrap:wrap;gap:6px}
.active:not(:empty){padding-top:8px}
.pill{font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;border:1px solid var(--amber);background:var(--amber-soft);color:var(--ink);cursor:pointer}
.pill::after{content:"×";font-size:14px;line-height:1;color:var(--muted)}
.tag:focus-visible,.pill:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp .list{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:grid;gap:14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.x{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.sheetfoot{display:flex;gap:8px;position:sticky;bottom:0;background:var(--surface);padding-top:10px;border-top:1px solid var(--line)}
.reset{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.done{flex:1;font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:0;background:var(--jade);color:var(--bg);cursor:pointer}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
@media (max-width:719px){
  .chip{font-size:13px;padding:6px 11px}
  .filters{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:85vh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    transform:translateY(100%);visibility:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .filters.open{transform:none;visibility:visible}
}
@media (min-width:720px){
  .fbtn,.active,.sheethead,.sheetfoot,.scrim{display:none!important}
  .bar{position:static}
  .filters{padding-top:12px;gap:10px}
  .grp{flex-direction:row;align-items:baseline;gap:10px}
  .grp .lbl{width:72px;flex:none}
}
@media (prefers-reduced-motion:no-preference){.filters{transition:transform .22s ease,visibility .22s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="cities" id="cities" aria-label="Cities" hidden></nav>
    <div class="eyebrow" id="eyebrow"></div>
    <h1><span id="cityname"></span> Picks</h1>
    <p class="lede" id="intro"></p>
  </header>
</div>

<div class="bar"><div class="wrap">
  <div class="row">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, area, food…" autocomplete="off" aria-label="Search places">
    </label>
    <button class="fbtn" id="fbtn" aria-controls="filters" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<span class="n" id="fcount" hidden></span>
    </button>
  </div>
  <div class="active" id="active"></div>
  <div class="filters" id="filters" role="dialog" aria-label="Filters">
    <div class="sheethead"><strong>Filters</strong><button class="x" id="fclose" aria-label="Close filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="grp"><span class="lbl">Category</span><div class="chips" id="chips"></div></div>
    <div id="panel"></div>
    <div class="sheetfoot"><button class="reset" id="reset">Reset</button><button class="done" id="done">Show places</button></div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</div></div>

<div class="wrap">
  <div class="status" id="status" aria-live="polite"></div>
  <main id="list"></main>
  <footer>Opening hours change, so check the Maps listing before you go.</footer>
</div>
<script src="data.js"></script>
<script>
const { categories: CATEGORIES, cities: CITIES } = window.PICKS;
const $ = s => document.querySelector(s);
let city = CITIES[0], activeCat = "all", sheetOpen = false;
const activeTags = new Set();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (s, q) => { const e = esc(s); if(!q) return e; const i = s.toLowerCase().indexOf(q); return i<0 ? e : esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length)); };
const catLabel = id => (CATEGORIES.find(c=>c.id===id)||{label:id}).label;
const cityCats = () => CATEGORIES.filter(c => city.places.some(p => p.cat===c.id));
const ICON_COPY = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>`;
const ICON_OK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>`;

// Remember the last city and each city's filters in this browser only.
const STORE_KEY = "travelpicks:v1";
function loadStore(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(_) { return {}; } }
function saveStore(){
  try {
    const st = loadStore(); st.lastCity = city.id; st.cities = st.cities || {};
    st.cities[city.id] = {cat: activeCat, tags: [...activeTags]};
    localStorage.setItem(STORE_KEY, JSON.stringify(st));
  } catch(_) {}
}
function restoreFilters(){
  const saved = ((loadStore().cities) || {})[city.id];
  if(!saved) return;
  const allTags = Object.values(city.tags || {}).flat();
  if(saved.cat==="all" || cityCats().some(c => c.id===saved.cat)) activeCat = saved.cat;
  (saved.tags || []).filter(t => allTags.includes(t)).forEach(t => activeTags.add(t));
}

function setCity(id){
  city = CITIES.find(c => c.id===id) || CITIES[0];
  activeCat = "all"; activeTags.clear(); $("#q").value = "";
  restoreFilters();
  document.title = city.name + " Picks";
  $("#cityname").textContent = city.name;
  $("#eyebrow").textContent = city.name + (city.zh ? " · " + city.zh : "");
  $("#intro").textContent = city.intro || "";
  $("#cities").hidden = CITIES.length < 2;
  $("#cities").innerHTML = CITIES.map(c => `<a class="city" href="#${c.id}" aria-current="${c.id===city.id?"page":"false"}">${esc(c.name)}${c.zh?` <span lang="zh-Hant">${esc(c.zh)}</span>`:""}</a>`).join("");
  render();
}

function filtered(){
  const q = $("#q").value.trim().toLowerCase();
  return {q, list: city.places.filter(p =>
    (activeCat==="all" || p.cat===activeCat) &&
    [...activeTags].every(t => p.tags.includes(t)) &&
    (!q || [p.name,p.zh,p.area,p.note,p.tip||"",catLabel(p.cat),...p.tags].join(" ").toLowerCase().includes(q))
  )};
}

function renderBar(){
  const base = city.places.filter(p => [...activeTags].every(t => p.tags.includes(t)));
  const cats = [{id:"all",label:"All"}].concat(cityCats());
  $("#chips").innerHTML = cats.map(c => {
    const n = c.id==="all" ? base.length : base.filter(p=>p.cat===c.id).length;
    return `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id===activeCat}">${esc(c.label)}<b>${n}</b></button>`;
  }).join("");
  const tagBtn = t => `<button class="tag" data-tag="${esc(t)}" aria-pressed="${activeTags.has(t)}">${esc(t)}</button>`;
  $("#panel").innerHTML = Object.entries(city.tags || {}).map(([g,ts]) => `<div class="grp"><span class="lbl">${esc(g)}</span><div class="list">${ts.map(tagBtn).join("")}</div></div>`).join("");
  $("#panel").style.display = $("#panel").innerHTML ? "grid" : "none";
  $("#panel").style.gap = "14px";
  const nActive = activeTags.size + (activeCat==="all" ? 0 : 1);
  $("#fcount").hidden = !nActive; $("#fcount").textContent = nActive;
  $("#active").innerHTML = (activeCat==="all" ? "" : `<button class="pill" data-cat="all" aria-label="Remove category ${esc(catLabel(activeCat))}">${esc(catLabel(activeCat))}</button>`) +
    [...activeTags].map(t => `<button class="pill" data-tag="${esc(t)}" aria-label="Remove tag ${esc(t)}">#${esc(t)}</button>`).join("");
}
function setSheet(open){
  sheetOpen = open;
  $("#filters").classList.toggle("open", open);
  $("#scrim").hidden = !open;
  $("#fbtn").setAttribute("aria-expanded", open);
  document.body.style.overflow = open ? "hidden" : "";
}

function cardHTML(p,q){ return `
  <article class="card">
    <div class="top"><div><h3 class="name"><span>${hl(p.name,q)}</span><button class="cp" data-copy="${esc(p.name)}" aria-label="Copy English name" title="Copy English name">${ICON_COPY}</button></h3>${p.zh?`<div class="zh"><span lang="zh-Hant">${hl(p.zh,q)}</span><button class="cp" data-copy="${esc(p.zh)}" aria-label="Copy local name" title="Copy local name">${ICON_COPY}</button></div>`:""}</div>${p.area?`<span class="area">${hl(p.area,q)}</span>`:""}</div>
    <p class="note">${hl(p.note,q)}</p>
    ${p.tip?`<div class="tip">${hl(p.tip,q)}</div>`:""}
    <div class="tags">${p.tags.map(t=>`<button class="tag" data-tag="${esc(t)}" aria-pressed="${activeTags.has(t)}">${hl(t,q)}</button>`).join("")}</div>
    <div class="actions"><a class="btn map" href="${p.map}" target="_blank" rel="noopener">Open in Maps ↗</a></div>
  </article>`; }

function render(){
  renderBar();
  saveStore();
  const {q, list} = filtered();
  const parts = [];
  if(activeTags.size) parts.push("Tagged " + [...activeTags].map(t=>"#"+t).join(" + "));
  if(q) parts.push(`matching “${q}”`);
  $("#status").textContent = parts.length ? `${list.length} place${list.length===1?"":"s"} · ${parts.join(", ")}` : "";
  const html = cityCats().map(c => {
    const items = list.filter(p => p.cat===c.id);
    if(!items.length) return "";
    const blurb = (city.blurbs||{})[c.id];
    return `<section><h2>${esc(c.label)}<small>${items.length} place${items.length>1?"s":""}</small></h2>
      ${blurb?`<p class="blurb">${esc(blurb)}</p>`:""}
      <div class="grid">${items.map(p=>cardHTML(p,q)).join("")}</div></section>`;
  }).join("");
  $("#list").innerHTML = html || `<div class="empty">Nothing matches. Try clearing a tag or searching something broader.</div>`;
  $("#done").textContent = `Show ${list.length} place${list.length===1?"":"s"}`;
}

function toggleTag(t){ activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); render(); }
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; activeCat = b.dataset.cat; render(); });
$("#panel").addEventListener("click", e => { const b = e.target.closest(".tag"); if(b) toggleTag(b.dataset.tag); });
$("#active").addEventListener("click", e => { const b = e.target.closest(".pill"); if(!b) return; if(b.dataset.cat) activeCat = "all"; else activeTags.delete(b.dataset.tag); render(); });
$("#fbtn").addEventListener("click", () => setSheet(true));
$("#fclose").addEventListener("click", () => setSheet(false));
$("#done").addEventListener("click", () => { setSheet(false); window.scrollTo({top: $("#list").offsetTop - 80}); });
$("#scrim").addEventListener("click", () => setSheet(false));
$("#reset").addEventListener("click", () => { activeCat = "all"; activeTags.clear(); render(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && sheetOpen) setSheet(false); });
$("#q").addEventListener("input", render);
$("#list").addEventListener("click", e => {
  const tg = e.target.closest(".tag"); if(tg){ toggleTag(tg.dataset.tag); window.scrollTo({top:0}); return; }
  const cp = e.target.closest(".cp"); if(!cp) return;
  const ok = () => { const t0 = cp.title; cp.innerHTML = ICON_OK; cp.classList.add("ok"); cp.title = "Copied"; setTimeout(()=>{ cp.innerHTML = ICON_COPY; cp.classList.remove("ok"); cp.title = t0; }, 1200); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  try { navigator.clipboard.writeText(cp.dataset.copy).then(ok, fallback); } catch(_) { fallback(); }
});
window.addEventListener("hashchange", () => setCity(location.hash.slice(1)));
setCity(location.hash.slice(1) || loadStore().lastCity);
</script>
</body>
</html>
